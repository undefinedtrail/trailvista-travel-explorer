name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Expo Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Compile Standalone Release APK (Embedded JS Bundle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📂 Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TrailVista.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrailVista-APK
          path: TrailVista.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "TrailVista v1.0.1 (Standalone Offline APK)"
          draft: false
          prerelease: false
          body: |
            ### 📱 TrailVista — Standalone Android APK (Release v1.0.1)

            Fully standalone release APK with embedded JavaScript bundle & assets.
            **Does not require Metro or any development server.**

            #### 📥 Quick Install Instructions:
            1. Download **`TrailVista.apk`** below directly onto your Android device.
            2. Open the downloaded file and select **"Install"** (allow *Install unknown apps* in your browser/file manager if prompted).
            3. Launch TrailVista directly from your app drawer!
          files: |
            TrailVista.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
